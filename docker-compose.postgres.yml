services:
  postgres:
    image: postgres:16-alpine
    container_name: foodbridge-postgres
    restart: always
    environment:
      POSTGRES_USER: foodbridge_user
      POSTGRES_PASSWORD: foodbridge_pass
      POSTGRES_DB: foodbridge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbridge_user -d foodbridge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foodbridge-redis
    restart: always
    ports:
      - "6379:6379"

  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: foodbridge-ml
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: foodbridge-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://foodbridge_user:foodbridge_pass@postgres:5432/foodbridge_db?schema=public"
      JWT_ACCESS_SECRET: "foodbridge_super_secure_access_secret_2026_dev_key"
      JWT_REFRESH_SECRET: "foodbridge_super_secure_refresh_secret_2026_dev_key"
      ML_SERVICE_URL: "http://ml-service:8001"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: foodbridge-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    depends_on:
      - api

volumes:
  pgdata:
