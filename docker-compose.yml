services:
  mongo:
    image: mongo:7.0
    container_name: foodbridge-mongo
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: echo "try { rs.status().ok } catch (e) { rs.initiate().ok }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: foodbridge-ml
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: foodbridge-api
    restart: always
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mongodb://mongo:27017/foodbridge?replicaSet=rs0&directConnection=true"
      JWT_ACCESS_SECRET: "foodbridge_super_secure_access_secret_2026_dev_key"
      JWT_REFRESH_SECRET: "foodbridge_super_secure_refresh_secret_2026_dev_key"
      ML_SERVICE_URL: "http://ml-service:8001"
      CORS_ORIGIN: "*"
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5001/api"
    container_name: foodbridge-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:5001/api"
    depends_on:
      - api

volumes:
  mongodata:
